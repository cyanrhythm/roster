name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only: the workflow only builds and tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test / clippy / fmt (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and the rustfmt/clippy
      # components, so rustup does the rest; this step just makes the
      # version visible in the log.
      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets
