cli.help: |
  dst-session-manager %{version}

  管理 dsh-tui（DST）会话日志。

  用法：
      dst-session-manager [选项]
      dst-session-manager --list [--json] [选项]
      dst-session-manager --rename <id> <标题> [选项]
      dst-session-manager --delete <id> [选项]
      dst-session-manager --set-cwd <id> <绝对路径> [选项]

  选项：
      --dsh-home <路径>       DSH 主目录（默认 $DSH_HOME 或 ~/.dsh）
      --data-dir <路径>       dsh-tui 数据目录（默认 ~/.dsh-tui）
      --sessions-root <路径>  额外的会话根目录（可重复）
      --lang <auto|zh-CN|en>  界面语言（默认跟随系统或上次选择）
      --list                  列出会话后退出
      --json                  与 --list 连用，输出 JSON
      --rename <id> <标题>    追加用户标题事件
      --delete <id>           将会话目录移入回收站
      --set-cwd <id> <路径>   修改会话工作区（header cwd + 目录）
      -h, --help              显示本帮助

  按键：
      ↑↓/jk 移动   / 筛选   r 重命名   w 工作区
      d 删除       R 刷新   L 语言     ? 帮助     q 退出

  会话 id 可以只写无歧义的前缀。

