cli.help: |
  roster %{version}

  管理 dsh-tui（DST）与 opencode 的会话；新的 agent 通过实现 SessionSource 接入。

  用法：
      roster [选项]
      roster --list [--json] [选项]
      roster --rename <id> <标题> [选项]
      roster --delete <id> [选项]
      roster --set-cwd <id> <绝对路径> [选项]

  选项：
      --source <all|dst|opencode>  只显示某个来源（默认 all）
      --source-dir <来源>=<路径>   给任意来源追加一个目录（可重复）
      --source-home <来源>=<路径>  给任意来源指定主目录
      --dsh-home <路径>       DST 主目录（默认 $DSH_HOME 或 ~/.dsh）
      --data-dir <路径>       本工具的数据目录（默认 ~/.dsh-tui）
      --sessions-root <路径>  额外的 DST 会话根目录（可重复）
      --opencode-dir <路径>   opencode 数据目录（可重复，默认 ~/.local/share/opencode）
      --lang <auto|zh-CN|en>  界面语言（默认跟随系统或上次选择）
      --list                  列出会话后退出
      --json                  与 --list 连用，输出 JSON
      --rename <id> <标题>    重命名会话
      --delete <id>           永久删除会话
      --set-cwd <id> <路径>   修改会话工作区
      -h, --help              显示本帮助

  按键：
      ↑↓/jk 移动   / 筛选   s 来源   r 重命名   w 工作区
      d 删除       R 刷新   L 语言   ? 帮助   q 退出

  会话 id 可以只写无歧义的前缀。

