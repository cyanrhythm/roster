cli.help: |
  dst-session-manager %{version}

  Manage dsh-tui (DST) session logs.

  USAGE:
      dst-session-manager [OPTIONS]
      dst-session-manager --list [--json] [OPTIONS]
      dst-session-manager --rename <id> <title> [OPTIONS]
      dst-session-manager --delete <id> [OPTIONS]
      dst-session-manager --set-cwd <id> <absolute-path> [OPTIONS]

  OPTIONS:
      --dsh-home <PATH>       DSH home (default: $DSH_HOME or ~/.dsh)
      --data-dir <PATH>       dsh-tui data dir (default: ~/.dsh-tui)
      --sessions-root <PATH>  Extra session root (repeatable)
      --lang <auto|zh-CN|en>  UI language (default: system or last choice)
      --list                  Print sessions and exit
      --json                  With --list, print JSON
      --rename <id> <title>   Append a user title event
      --delete <id>           Move the session directory to the trash
      --set-cwd <id> <path>   Change the session workspace (header cwd + directory)
      -h, --help              Show this help

  TUI KEYS:
      ↑↓/jk move   / filter   r rename   w workspace
      d delete     R reload   L language ? help   q quit

  Session ids may be abbreviated to an unambiguous prefix.

