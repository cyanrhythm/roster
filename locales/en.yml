cli.help: |
  roster %{version}

  Manage dsh-tui (DST) and opencode sessions; new agents plug in by implementing SessionSource.

  USAGE:
      roster [OPTIONS]
      roster --list [--json] [OPTIONS]
      roster --rename <id> <title> [OPTIONS]
      roster --delete <id> [OPTIONS]
      roster --set-cwd <id> <absolute-path> [OPTIONS]

  OPTIONS:
      --source <all|dst|opencode>  Show one source only (default: all)
      --source-dir <SOURCE>=<PATH>  Add a directory for any source (repeatable)
      --source-home <SOURCE>=<PATH> Override a source's home directory
      --dsh-home <PATH>       DST home (default: $DSH_HOME or ~/.dsh)
      --data-dir <PATH>       This tool's data dir (default: ~/.dsh-tui)
      --sessions-root <PATH>  Extra DST session root (repeatable)
      --opencode-dir <PATH>   opencode data dir (repeatable, ~/.local/share/opencode)
      --lang <auto|zh-CN|en>  UI language (default: system or last choice)
      --list                  Print sessions and exit
      --json                  With --list, print JSON
      --rename <id> <title>   Rename a session
      --delete <id>           Delete a session permanently
      --set-cwd <id> <path>   Change a session's workspace
      -h, --help              Show this help

  TUI KEYS:
      ↑↓/jk move   / filter   s source   r rename   w workspace
      d delete     R reload   L language ? help     q quit

  Session ids may be abbreviated to an unambiguous prefix.

